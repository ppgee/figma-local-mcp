<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        color-scheme: light dark;
        --text: var(--figma-color-text, #181d25);
        --text-secondary: var(--figma-color-text-secondary, #5f6875);
        --text-tertiary: var(--figma-color-text-tertiary, #8a93a1);
        --surface: var(--figma-color-bg, #ffffff);
        --surface-secondary: var(--figma-color-bg-secondary, #f5f6f8);
        --surface-tertiary: var(--figma-color-bg-tertiary, #eceff3);
        --border: var(--figma-color-border, #e1e5eb);
        --brand: var(--figma-color-bg-brand, #0d99ff);
        --on-brand: var(--figma-color-text-onbrand, #ffffff);
        --success: var(--figma-color-text-success, #18794e);
        --success-bg: rgba(20, 174, 111, .12);
        --danger: var(--figma-color-text-danger, #c62b31);
        --danger-bg: rgba(198, 43, 49, .12);
      }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      body {
        margin: 0;
        background: var(--surface);
        color: var(--text);
        font: 12px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        user-select: none;
      }
      button, summary { -webkit-tap-highlight-color: transparent; }
      button { font: inherit; }
      button:focus-visible, summary:focus-visible, textarea:focus-visible {
        outline: 2px solid var(--brand);
        outline-offset: 3px;
      }
      button { cursor: pointer; }
      button:disabled { cursor: default; opacity: .48; }
      .icon { width: 16px; height: 16px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
      .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
      #expanded { min-height: 100vh; padding: 16px; }
      .app-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
      .brand { display: flex; align-items: center; gap: 9px; min-width: 0; }
      .brand-mark { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; background: var(--text); color: var(--surface); }
      .brand-mark .icon { width: 18px; height: 18px; }
      h1 { margin: 0; font-size: 13px; line-height: 18px; font-weight: 650; letter-spacing: -.1px; }
      .brand-caption { margin: 0; color: var(--text-tertiary); font-size: 10px; line-height: 13px; }
      .window-actions { display: flex; gap: 2px; margin-right: -4px; }
      .icon-button { display: inline-grid; place-items: center; width: 28px; height: 28px; padding: 0; border: 0; border-radius: 6px; background: transparent; color: var(--text-secondary); transition: background .15s, color .15s; }
      .icon-button:hover { background: var(--surface-secondary); color: var(--text); }
      .lang-button { font-size: 11px; font-weight: 600; }
      .connection { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 7px; min-height: 28px; margin-bottom: 12px; padding: 5px 9px; border-radius: 6px; background: var(--surface-secondary); color: var(--text-secondary); font-size: 11px; }
      .connection[data-state="connected"] { background: var(--success-bg); color: var(--success); }
      .connection[data-state="disconnected"] { background: var(--danger-bg); color: var(--danger); }
      .connection-dot { display: inline-block; flex: 0 0 auto; width: 6px; height: 6px; border-radius: 50%; background: var(--text-tertiary); }
      .connection-dot[data-state="connected"] { background: #14ae6f; box-shadow: 0 0 0 3px rgba(20, 174, 111, .1); }
      .connection-dot[data-state="disconnected"] { background: #e25555; }
      #retry { margin-left: auto; padding: 0 0 0 8px; border: 0; background: transparent; color: inherit; font-size: 11px; text-decoration: underline; text-underline-offset: 2px; }
      #connection-label { flex: 0 0 auto; white-space: nowrap; }
      #connection-hint { flex: 1 1 100%; color: inherit; font-size: 10px; line-height: 1.45; opacity: .78; white-space: normal; overflow-wrap: anywhere; }
      .selection-card { padding: 13px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
      .section-heading { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; color: var(--text-secondary); font-size: 11px; }
      .live-label { display: inline-flex; align-items: center; gap: 4px; color: var(--text-tertiary); font-size: 10px; }
      .live-label::before { content: ""; width: 4px; height: 4px; border-radius: 50%; background: #14ae6f; }
      .node-row { display: flex; align-items: center; gap: 9px; min-width: 0; margin-bottom: 9px; }
      .node-symbol { display: grid; place-items: center; flex: 0 0 auto; width: 30px; height: 30px; border-radius: 6px; background: var(--surface-secondary); color: var(--text-secondary); }
      .node-info { min-width: 0; }
      #node-name { margin: 0; overflow: hidden; color: var(--text); font-size: 13px; line-height: 19px; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
      #node-type { display: block; color: var(--text-tertiary); font-size: 9px; line-height: 13px; letter-spacing: .7px; }
      .node-id-row { display: flex; align-items: center; gap: 8px; min-width: 0; margin-bottom: 12px; padding: 5px 7px; border-radius: 5px; background: var(--surface-secondary); }
      .node-id-label { flex: 0 0 auto; color: var(--text-tertiary); font-size: 10px; }
      #node-id { overflow: hidden; color: var(--text-secondary); font: 10px/16px ui-monospace, SFMono-Regular, Menlo, monospace; text-overflow: ellipsis; white-space: nowrap; user-select: text; }
      .empty-selection { padding: 7px 0 16px; text-align: center; }
      .empty-selection .icon { width: 24px; height: 24px; margin-bottom: 6px; color: var(--text-tertiary); }
      #empty-title { margin: 0 0 3px; font-size: 12px; font-weight: 500; }
      #empty-description { margin: 0; color: var(--text-tertiary); font-size: 11px; }
      .primary-button { display: flex; align-items: center; justify-content: center; gap: 7px; width: 100%; min-height: 34px; padding: 7px 12px; border: 0; border-radius: 6px; background: var(--brand); color: var(--on-brand); font-size: 12px; font-weight: 550; transition: filter .15s, transform .15s; }
      .primary-button:not(:disabled):hover { filter: brightness(.94); }
      .primary-button:not(:disabled):active { transform: scale(.985); }
      .primary-button.copied { background: #14a06a; }
      .copy-hint { margin: 7px 0 0; color: var(--text-tertiary); font-size: 10px; text-align: center; }
      kbd { padding: 0 3px; border: 1px solid var(--border); border-radius: 3px; background: var(--surface-secondary); font: 9px/14px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .prompt-section { margin-top: 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-secondary); }
      .prompt-section summary { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 8px; color: var(--text-secondary); cursor: pointer; font-size: 11px; list-style: none; }
      .prompt-section summary::-webkit-details-marker { display: none; }
      .prompt-section summary .icon { width: 12px; height: 12px; transition: transform .15s; }
      .prompt-section:not([open]) summary .icon { transform: rotate(-90deg); }
      .summary-hint { margin-left: auto; color: var(--text-tertiary); font-size: 10px; }
      #prompt-preview, #manual-prompt { display: block; width: calc(100% - 20px); height: 90px; margin: 0 10px 10px; padding: 8px; border: 1px solid var(--border); border-radius: 5px; background: var(--surface); color: var(--text-secondary); font: 10px/15px ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; overflow-wrap: anywhere; overflow-y: auto; user-select: text; }
      #manual-prompt { height: 70px; resize: none; }
      #manual-help { margin: -3px 10px 9px; color: var(--danger); font-size: 10px; }
      .app-footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 12px; color: var(--text-tertiary); font-size: 9px; }
      #document-context { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .local-label { flex: 0 0 auto; }
      #collapsed { align-items: center; gap: 9px; height: 100vh; padding: 10px 12px; }
      #collapsed:not([hidden]) { display: flex; }
      #compact-retry { display: grid; place-items: center; flex: 0 0 auto; width: 22px; height: 22px; padding: 0; border: 0; border-radius: 50%; background: transparent; }
      #compact-retry:hover { background: var(--surface-secondary); }
      .compact-node { flex: 1; min-width: 0; }
      #compact-node-name { display: block; overflow: hidden; font-size: 12px; line-height: 18px; font-weight: 550; text-overflow: ellipsis; white-space: nowrap; }
      #compact-node-detail { display: block; overflow: hidden; color: var(--text-tertiary); font-size: 9px; line-height: 13px; text-overflow: ellipsis; white-space: nowrap; }
      #compact-copy { display: flex; align-items: center; justify-content: center; gap: 5px; min-width: 64px; height: 30px; padding: 0 9px; border: 0; border-radius: 6px; background: var(--brand); color: var(--on-brand); font-size: 11px; }
      #compact-copy .icon { width: 13px; height: 13px; }
      #toast { position: fixed; z-index: 10; right: 12px; bottom: 12px; left: 12px; padding: 9px 12px; border-radius: 7px; background: #252b33; box-shadow: 0 4px 18px rgba(0, 0, 0, .2); color: #fff; font-size: 11px; text-align: center; overflow-wrap: anywhere; }
      #toast[data-tone="error"] { background: #b4232c; }
      body[data-view="collapsed"] { overflow: hidden; }
      body[data-view="collapsed"] #toast { right: 8px; bottom: 7px; left: 8px; padding: 6px 8px; }
      @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
    </style>
  </head>
  <body data-view="expanded">
    <svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
      <symbol id="icon-bridge" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><path d="M10 6.5h4a3.5 3.5 0 0 1 3.5 3.5v4M14 17.5h-4A3.5 3.5 0 0 1 6.5 14v-4"/></symbol>
      <symbol id="icon-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></symbol>
      <symbol id="icon-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
      <symbol id="icon-collapse" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></symbol>
      <symbol id="icon-expand" viewBox="0 0 24 24"><path d="m7 14 5-5 5 5"/></symbol>
      <symbol id="icon-frame" viewBox="0 0 24 24"><path d="M7 3v18M17 3v18M3 7h18M3 17h18M7 7h10v10H7z"/></symbol>
      <symbol id="icon-cursor" viewBox="0 0 24 24"><path d="m5 3 14 9-7 1-3 7z"/></symbol>
    </svg>

    <main id="expanded">
      <header class="app-header">
        <div class="brand">
          <span class="brand-mark"><svg class="icon"><use href="#icon-bridge"/></svg></span>
          <div><h1>Figma Local MCP</h1><p class="brand-caption" id="brand-caption"></p></div>
        </div>
        <div class="window-actions">
          <button id="language-toggle" class="icon-button lang-button" type="button"><span id="language-label"></span></button>
          <button id="collapse-window" class="icon-button" type="button"><svg class="icon"><use href="#icon-collapse"/></svg></button>
        </div>
      </header>

      <div id="connection" class="connection" data-state="connecting" role="status">
        <span class="connection-dot" data-connection-dot data-state="connecting"></span>
        <span id="connection-label"></span>
        <span id="connection-hint" hidden></span>
        <button id="retry" type="button" hidden></button>
      </div>

      <section class="selection-card" id="selection-card">
        <div class="section-heading"><span id="selection-heading"></span><span class="live-label" id="live-label"></span></div>
        <div id="single-selection" hidden>
          <div class="node-row">
            <span class="node-symbol"><svg class="icon"><use href="#icon-frame"/></svg></span>
            <div class="node-info"><h2 id="node-name"></h2><span id="node-type"></span></div>
          </div>
          <div class="node-id-row"><span class="node-id-label">nodeId</span><code id="node-id"></code></div>
        </div>
        <div id="empty-selection" class="empty-selection">
          <svg class="icon"><use href="#icon-cursor"/></svg>
          <p id="empty-title"></p>
          <p id="empty-description"></p>
        </div>
        <button id="copy-prompt" class="primary-button" type="button" disabled></button>
        <p class="copy-hint"><span id="copy-hint-text"></span> · <kbd id="shortcut">⌘ ⇧ C</kbd></p>
      </section>

      <details id="prompt-details" class="prompt-section" open>
        <summary><svg class="icon"><use href="#icon-collapse"/></svg><span id="prompt-summary"></span><span class="summary-hint" id="paste-hint"></span></summary>
        <pre id="prompt-preview"></pre>
        <textarea id="manual-prompt" readonly spellcheck="false" hidden></textarea>
        <p id="manual-help" hidden><span id="manual-prefix"></span> <span class="manual-shortcut">⌘ C</span> <span id="manual-suffix"></span></p>
      </details>

      <footer class="app-footer"><span id="document-context"></span><span class="local-label" id="local-label"></span></footer>
    </main>

    <section id="collapsed" hidden>
      <button id="compact-retry" type="button"><span class="connection-dot" data-connection-dot data-state="connecting"></span></button>
      <div class="compact-node"><span id="compact-node-name"></span><span id="compact-node-detail"></span></div>
      <button id="compact-copy" type="button" disabled></button>
      <button id="expand-window" class="icon-button" type="button"><svg class="icon"><use href="#icon-expand"/></svg></button>
    </section>
    <div id="toast" role="status" aria-live="polite" hidden></div>

    <script>
      (() => {
        const $ = (id) => document.getElementById(id);
        const MESSAGES = {
          en: {
            brandCaption: 'Connect canvas to your agents',
            collapseTitle: 'Collapse to mini bar',
            collapseAria: 'Collapse window',
            expandTitle: 'Expand window',
            expandAria: 'Expand window',
            langTitle: 'Switch language',
            connecting: 'Connecting to local service…',
            connected: 'Local MCP service connected',
            disconnected: 'Local MCP service disconnected',
            retry: 'Retry',
            connectingShort: 'Connecting…',
            selectionSection: 'Current selection',
            liveLabel: 'Live',
            readingSelection: 'Reading selection…',
            copyPrompt: 'Copy node prompt',
            copyHint: 'Re-reads selection on click',
            promptPreview: 'Prompt preview',
            pasteHint: 'Paste straight to an agent',
            promptPlaceholder: 'Select a layer to see the copyable prompt here.',
            manualAria: 'Manually copy the node prompt',
            manualPrefix: 'Auto-copy unavailable; text is selected — press',
            manualSuffix: 'to copy.',
            localApi: 'Local Plugin API',
            noQuota: 'No official quota',
            collapsedAria: 'Collapsed Figma Local MCP',
            copy: 'Copy',
            copyingMain: 'Copying…',
            copyingCompact: 'Copying',
            copiedMain: 'Copied — go paste',
            copiedCompact: 'Copied',
            layersSelected: '{count} layers selected',
            noSelection: 'No selection',
            keepOne: 'Keep only one layer selected',
            selectCanvas: 'Select a layer on the Figma canvas',
            compactSelected: '{count} selected',
            compactNoSelection: 'No selection',
            selectOneOnly: 'Select one layer only',
            compactFallback: 'Figma Local MCP',
            dotConnected: 'Local service connected',
            dotDisconnected: 'Local service disconnected',
            toastSelectOneCopy: 'Select only one layer, then copy',
            toastSelectFirst: 'Select a layer in Figma first',
            toastReadFail: 'Could not read the latest selection; try again.',
            toastCopied: 'Prompt for "{name}" copied',
            toastNoPrompt: 'Cannot build a prompt for this selection; reselect.',
            toastManualCopy: 'Auto-copy unavailable; copy the selected text manually.',
            toastSelectionChanged: 'Selection changed; click copy again.',
            untitledNode: 'Untitled node',
            nodeFallback: 'node',
          },
          zh: {
            brandCaption: '连接画布与你的 Agent',
            collapseTitle: '收起为小状态条',
            collapseAria: '收起窗口',
            expandTitle: '展开窗口',
            expandAria: '展开窗口',
            langTitle: '切换语言',
            connecting: '正在连接本地服务…',
            connected: '本地 MCP 服务已连接',
            disconnected: '本地 MCP 服务未连接',
            retry: '重试',
            connectingShort: '连接中…',
            selectionSection: '当前选中',
            liveLabel: '实时同步',
            readingSelection: '正在读取选区…',
            copyPrompt: '复制节点 Prompt',
            copyHint: '点击时读取最新选区',
            promptPreview: 'Prompt 预览',
            pasteHint: '直接粘贴给 Agent',
            promptPlaceholder: '选中一个图层后，这里会显示可复制的 Prompt。',
            manualAria: '手动复制节点 Prompt',
            manualPrefix: '自动复制不可用，文本已全选，请按',
            manualSuffix: '复制。',
            localApi: '本地 Plugin API',
            noQuota: '不消耗官方额度',
            collapsedAria: '已收起的 Figma Local MCP',
            copy: '复制',
            copyingMain: '正在复制…',
            copyingCompact: '复制中',
            copiedMain: '已复制，去粘贴吧',
            copiedCompact: '已复制',
            layersSelected: '已选中 {count} 个图层',
            noSelection: '尚未选中图层',
            keepOne: '请只保留一个选中的图层',
            selectCanvas: '请在 Figma 画布中选择一个图层',
            compactSelected: '已选 {count} 个图层',
            compactNoSelection: '未选中图层',
            selectOneOnly: '请只选择一个图层',
            compactFallback: 'Figma Local MCP',
            dotConnected: '本地服务已连接',
            dotDisconnected: '本地服务未连接',
            toastSelectOneCopy: '请只选中一个图层后再复制',
            toastSelectFirst: '请先在 Figma 中选中一个图层',
            toastReadFail: '未能读取最新选区，请重试。',
            toastCopied: '已复制「{name}」的 Prompt',
            toastNoPrompt: '当前选区无法生成 Prompt，请重新选择。',
            toastManualCopy: '自动复制不可用，请手动复制已全选的文本。',
            toastSelectionChanged: '选区已变化，请重新点击复制。',
            untitledNode: '未命名节点',
            nodeFallback: '节点',
          },
        };

        const state = { ready: false, connected: false, connectionHint: '', collapsed: false, fileName: '', pageName: '', selectionCount: 0, selectedNode: null, prompt: '' };
        const isMac = /Mac|iPhone|iPad/.test(navigator.platform);
        let localeOverride = null; // 'zh' | 'en' | null, set by the plugin main thread
        let locale = 'en'; // effective locale, kept in sync with the plugin main thread
        let activeCopyId = 0;
        let copying = false;
        let copyTimeout = null;
        let toastTimeout = null;
        let renderedPrompt = null;

        function computeLocale() {
          if (localeOverride === 'zh' || localeOverride === 'en') return localeOverride;
          return /^zh/i.test(navigator.language || '') ? 'zh' : 'en';
        }

        function t(key, params = {}) {
          let text = MESSAGES[locale][key] ?? MESSAGES.en[key] ?? key;
          for (const [name, value] of Object.entries(params)) {
            text = text.split(`{${name}}`).join(String(value));
          }
          return text;
        }

        function send(type, extra = {}) {
          parent.postMessage({ pluginMessage: { type, ...extra } }, '*');
        }

        function icon(name) {
          return `<svg class="icon" aria-hidden="true"><use href="#icon-${name}"/></svg>`;
        }

        function showToast(message, tone = 'default') {
          clearTimeout(toastTimeout);
          $('toast').textContent = message;
          $('toast').dataset.tone = tone;
          $('toast').setAttribute('role', tone === 'error' ? 'alert' : 'status');
          $('toast').hidden = false;
          toastTimeout = setTimeout(() => { $('toast').hidden = true; }, tone === 'error' ? 4500 : 2600);
        }

        function applyStaticTexts() {
          document.documentElement.lang = locale === 'zh' ? 'zh-CN' : 'en';
          $('brand-caption').textContent = t('brandCaption');
          const collapse = $('collapse-window');
          collapse.title = t('collapseTitle');
          collapse.setAttribute('aria-label', t('collapseAria'));
          const expand = $('expand-window');
          expand.title = t('expandTitle');
          expand.setAttribute('aria-label', t('expandAria'));
          $('language-toggle').title = t('langTitle');
          $('language-toggle').setAttribute('aria-label', t('langTitle'));
          $('language-label').textContent = locale === 'zh' ? 'EN' : '中';
          $('selection-card').setAttribute('aria-label', t('selectionSection'));
          $('selection-heading').textContent = t('selectionSection');
          $('live-label').textContent = t('liveLabel');
          $('copy-hint-text').textContent = t('copyHint');
          $('prompt-summary').textContent = t('promptPreview');
          $('paste-hint').textContent = t('pasteHint');
          $('prompt-preview').textContent = state.prompt || t('promptPlaceholder');
          $('manual-prompt').setAttribute('aria-label', t('manualAria'));
          $('manual-prefix').textContent = t('manualPrefix');
          $('manual-suffix').textContent = t('manualSuffix');
          $('local-label').textContent = t('noQuota');
          $('compact-retry').title = t('retry');
          $('compact-retry').setAttribute('aria-label', t('retry'));
          $('collapsed').setAttribute('aria-label', t('collapsedAria'));
        }

        function clearFeedback() {
          $('copy-prompt').classList.remove('copied');
          renderCopyButtons();
        }

        function renderCopyButtons() {
          const disabled = copying || !state.selectedNode;
          $('copy-prompt').disabled = disabled;
          $('compact-copy').disabled = disabled;
          $('copy-prompt').setAttribute('aria-busy', String(copying));
          if (copying) {
            $('copy-prompt').innerHTML = `${icon('copy')}<span>${t('copyingMain')}</span>`;
            $('compact-copy').innerHTML = `${icon('copy')}<span>${t('copyingCompact')}</span>`;
          } else {
            $('copy-prompt').innerHTML = `${icon('copy')}<span>${t('copyPrompt')}</span>`;
            $('compact-copy').innerHTML = `${icon('copy')}<span>${t('copy')}</span>`;
          }
        }

        function hideManualPrompt() {
          $('manual-prompt').hidden = true;
          $('manual-help').hidden = true;
          $('prompt-preview').hidden = false;
        }

        function renderSelection() {
          const node = state.selectedNode;
          $('document-context').textContent = state.ready ? `${state.fileName} / ${state.pageName}` : t('localApi');
          $('document-context').title = $('document-context').textContent;
          $('single-selection').hidden = !node;
          $('empty-selection').hidden = Boolean(node);
          if (node) {
            $('node-name').textContent = node.name || t('untitledNode');
            $('node-name').title = node.name;
            $('node-type').textContent = node.type;
            $('node-id').textContent = node.id;
            $('compact-node-name').textContent = node.name || t('untitledNode');
            $('compact-node-name').title = node.name;
            $('compact-node-detail').textContent = `${node.type} · ${node.id}`;
          } else {
            const multiple = state.selectionCount > 1;
            $('empty-title').textContent = state.ready
              ? (multiple ? t('layersSelected', { count: state.selectionCount }) : t('noSelection'))
              : t('readingSelection');
            $('empty-description').textContent = multiple ? t('keepOne') : t('selectCanvas');
            $('compact-node-name').textContent = state.ready
              ? (multiple ? t('compactSelected', { count: state.selectionCount }) : t('compactNoSelection'))
              : t('readingSelection');
            $('compact-node-detail').textContent = multiple ? t('selectOneOnly') : t('compactFallback');
          }
          if (renderedPrompt !== state.prompt) {
            renderedPrompt = state.prompt;
            $('prompt-preview').textContent = state.prompt || t('promptPlaceholder');
            $('manual-prompt').value = state.prompt;
            hideManualPrompt();
            clearFeedback();
          }
          renderCopyButtons();
        }

        function renderConnection() {
          const connectionState = state.connected ? 'connected' : (state.ready ? 'disconnected' : 'connecting');
          $('connection').dataset.state = connectionState;
          $('connection-label').textContent = state.connected
            ? t('connected')
            : (state.ready ? t('disconnected') : t('connecting'));
          const hint = $('connection-hint');
          const hintText = !state.connected && state.ready ? state.connectionHint : '';
          hint.textContent = hintText;
          hint.hidden = !hintText;
          hint.title = hintText;
          $('retry').hidden = state.connected || !state.ready;
          document.querySelectorAll('[data-connection-dot]').forEach((dot) => {
            dot.dataset.state = connectionState;
            dot.title = state.connected ? t('dotConnected') : t('dotDisconnected');
          });
        }

        function renderView() {
          document.body.dataset.view = state.collapsed ? 'collapsed' : 'expanded';
          $('expanded').hidden = state.collapsed;
          $('collapsed').hidden = !state.collapsed;
          $('toast').hidden = true;
        }

        function setCopying(value) {
          copying = value;
          clearTimeout(copyTimeout);
          clearFeedback();
          renderCopyButtons();
        }

        function requestCopy() {
          if (copying) return;
          if (!state.selectedNode) {
            showToast(state.selectionCount > 1 ? t('toastSelectOneCopy') : t('toastSelectFirst'), 'error');
            return;
          }
          setCopying(true);
          const requestId = ++activeCopyId;
          copyTimeout = setTimeout(() => {
            if (requestId !== activeCopyId) return;
            activeCopyId += 1;
            setCopying(false);
            showToast(t('toastReadFail'), 'error');
          }, 5000);
          send('copy-prompt', { requestId });
        }

        async function copyText(text) {
          if (navigator.clipboard && window.isSecureContext) {
            try {
              const copied = await Promise.race([
                navigator.clipboard.writeText(text).then(() => true),
                new Promise((resolve) => setTimeout(() => resolve(false), 200)),
              ]);
              if (copied) return true;
            } catch {}
          }
          const textarea = document.createElement('textarea');
          textarea.value = text;
          textarea.readOnly = true;
          textarea.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
          document.body.appendChild(textarea);
          textarea.focus();
          textarea.select();
          let copied = false;
          try { copied = document.execCommand('copy'); } catch {}
          textarea.remove();
          return copied;
        }

        function showCopiedFeedback() {
          const name = state.selectedNode ? state.selectedNode.name || t('untitledNode') : t('nodeFallback');
          $('copy-prompt').classList.add('copied');
          $('copy-prompt').innerHTML = `${icon('check')}<span>${t('copiedMain')}</span>`;
          $('compact-copy').innerHTML = `${icon('check')}<span>${t('copiedCompact')}</span>`;
          showToast(t('toastCopied', { name }));
        }

        async function receivePrompt(message) {
          if (message.requestId !== activeCopyId) return;
          setCopying(false);
          if (!message.prompt) {
            showToast(t('toastNoPrompt'), 'error');
            return;
          }
          const copied = await copyText(message.prompt);
          if (message.requestId !== activeCopyId) return;
          if (copied) {
            hideManualPrompt();
            showCopiedFeedback();
          } else if (state.selectedNode) {
            $('prompt-details').open = true;
            $('prompt-preview').hidden = true;
            $('manual-prompt').hidden = false;
            $('manual-prompt').value = message.prompt;
            $('manual-help').hidden = false;
            $('manual-prompt').focus();
            $('manual-prompt').select();
            showToast(t('toastManualCopy'), 'error');
          } else {
            showToast(t('toastSelectionChanged'), 'error');
          }
        }

        function applyLocale() {
          applyStaticTexts();
          renderConnection();
          renderSelection();
        }

        window.onmessage = (event) => {
          const message = event.data.pluginMessage;
          if (!message) return;
          if (message.type === 'status') {
            const previousNodeId = state.selectedNode && state.selectedNode.id;
            state.ready = true;
            state.connected = message.connected;
            state.connectionHint = message.connectionHint || '';
            state.fileName = message.fileName || '';
            state.pageName = message.pageName || '';
            state.selectionCount = message.selectionCount;
            state.selectedNode = message.selectedNode;
            state.prompt = message.prompt || '';
            if (previousNodeId !== (state.selectedNode && state.selectedNode.id)) {
              activeCopyId += 1;
              setCopying(false);
            }
            renderConnection();
            renderSelection();
          } else if (message.type === 'view') {
            state.collapsed = message.collapsed;
            renderView();
          } else if (message.type === 'locale') {
            localeOverride = message.locale === 'zh' || message.locale === 'en' ? message.locale : null;
            locale = computeLocale();
            applyLocale();
          } else if (message.type === 'prompt') {
            void receivePrompt(message);
          } else if (message.type === 'prompt-error' && message.requestId === activeCopyId) {
            setCopying(false);
            showToast(message.message, 'error');
          } else if (message.type === 'notice') {
            showToast(message.message, 'error');
          }
        };

        $('copy-prompt').addEventListener('click', requestCopy);
        $('compact-copy').addEventListener('click', requestCopy);
        $('language-toggle').addEventListener('click', () => {
          locale = locale === 'zh' ? 'en' : 'zh';
          localeOverride = locale;
          send('set-locale', { locale, persist: true });
          applyLocale();
        });
        $('retry').addEventListener('click', () => {
          $('retry').disabled = true;
          $('retry').textContent = t('connectingShort');
          send('retry');
          setTimeout(() => {
            $('retry').disabled = false;
            $('retry').textContent = t('retry');
          }, 1200);
        });
        $('compact-retry').addEventListener('click', () => send('retry'));
        $('collapse-window').addEventListener('click', () => send('set-view', { collapsed: true }));
        $('expand-window').addEventListener('click', () => send('set-view', { collapsed: false }));
        $('manual-prompt').addEventListener('focus', () => $('manual-prompt').select());
        document.addEventListener('keydown', (event) => {
          if ((event.metaKey || event.ctrlKey) && event.shiftKey && event.key.toLowerCase() === 'c') {
            event.preventDefault();
            requestCopy();
          }
        });

        $('shortcut').textContent = isMac ? '⌘ ⇧ C' : 'Ctrl Shift C';
        document.querySelectorAll('.manual-shortcut').forEach((element) => { element.textContent = isMac ? '⌘ C' : 'Ctrl C'; });
        locale = computeLocale();
        applyLocale();
        renderView();
        send('ready');
        send('set-locale', { locale, persist: false });
      })();
    </script>
  </body>
</html>
